<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="week-ctr.css">
</head>

<body>
    <nav class="topnav">
        <a href="index.html">Home</a>
        <a class="active" href="#">Week Counter</a>
    </nav>
    <main>
        <h2>Week Counter</h2>
        <div class="collection" id="collection">
            <div class="active-week" id="active-week"></div>
            <div class="non-active-week" id="non-active-week"></div>
        </div>
        <script>
            function multiplyNode(node, count, start) {
                //node.innerHTML = start++;
                for (var i = 0, copy; i < count - 1; i++) {
                    copy = node.cloneNode(true);
                    //copy.innerHTML = start++;
                    node.parentNode.insertBefore(copy, node.nextSibling);
                    node = copy;
                }
            }
            let weeks80 = 4174;
            let age = 1147;
            multiplyNode(document.getElementById("active-week"), age, 1);
            multiplyNode(document.getElementById("non-active-week"), weeks80-age, age + 1);
        </script>
    </main>
</body>

</html>
